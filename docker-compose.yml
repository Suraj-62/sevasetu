version: '3.8'

services:
  server:
    build: ./server
    container_name: sevasetu_server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    restart: always

  client:
    build: 
      context: ./client
      args:
        # Empty string makes Vite use relative paths (/api/...)
        # which are proxied by Nginx to the server container!
        - VITE_API_URL=
    container_name: sevasetu_client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always
